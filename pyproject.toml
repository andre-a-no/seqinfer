[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seqinfer"
version = "0.1.0"
description = "Reference implementation of an architecture that separates sequential statistical inference from experimental runtime"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.10"
authors = [
    { name = "Alexander Stepanov" },
    { name = "Andrej Novikov" },
]
maintainers = [
    { name = "Novikov Laboratories LLC", email = "andrei@hobukob.ru" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Unicode in strings and comments is intentional (Russian text, math)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "RUF012"]

[tool.mypy]
python_version = "3.10"
files = ["src/seqinfer"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
