[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-analysis"
dynamic = ["version"]
description = "Sequential testing and online inference: SPRT, anytime-valid A/B tests and confidence sequences, group sequential trials, change-point detection, Kalman and particle filters; checkpointed and reproducible"
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Commercial"  # see COMMERCIAL.md
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.10"
authors = [
    { name = "Alexander Stepanov" },
    { name = "Andrej Novikov" },
]
maintainers = [
    { name = "Novikov Laboratories LLC", email = "andrei@hobukob.ru" },
]
keywords = [
    "sequential analysis", "sequential testing", "SPRT", "A/B testing", "online experiments", "anytime-valid inference",
    "confidence sequence", "always-valid p-value", "e-values", "optional stopping", "nonparametric statistics",
    "quantile", "group sequential design", "alpha spending", "clinical trials", "Kiefer-Weiss", "change-point detection",
    "CUSUM", "Bayesian online changepoint detection", "Kalman filter", "particle filter", "hidden Markov model",
    "state space model", "streaming statistics", "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andre-a-no/sequential-analysis"
Source = "https://github.com/andre-a-no/sequential-analysis"
Issues = "https://github.com/andre-a-no/sequential-analysis/issues"
Documentation = "https://github.com/andre-a-no/sequential-analysis#readme"
Changelog = "https://github.com/andre-a-no/sequential-analysis/blob/main/CHANGELOG.md"
Performance = "https://github.com/andre-a-no/sequential-analysis/blob/main/PERFORMANCE.md"
Paper = "https://github.com/andre-a-no/sequential-analysis/blob/main/paper/main.pdf"
"Commercial license" = "https://github.com/andre-a-no/sequential-analysis/blob/main/COMMERCIAL.md"

[project.optional-dependencies]
fast = ["numpy>=1.22"]  # optimal designs, particle filters, kernel and betting procedures as array operations

[tool.setuptools.dynamic]
version = { attr = "sequential_analysis.version.__version__" }  # the one place the version is written

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sequential_analysis = ["data/*.json", "py.typed"]  # precomputed tables (tools/least_favourable_table.py); typed

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Unicode in strings and comments is intentional (Russian text, math)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "RUF012"]

[tool.mypy]
python_version = "3.10"
files = ["src/sequential_analysis"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true  # optional; the design module uses it when it is installed
