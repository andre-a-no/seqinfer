[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-analysis"
dynamic = ["version"]
description = "Sequential statistical procedures (SPRT, Kiefer-Weiss, anytime-valid and group sequential tests, change-point detection) separated from a reproducible experimental runtime"
readme = "README.md"
license = "AGPL-3.0-only OR LicenseRef-Commercial"  # see COMMERCIAL.md
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.10"
authors = [
    { name = "Alexander Stepanov" },
    { name = "Andrej Novikov" },
]
maintainers = [
    { name = "Novikov Laboratories LLC", email = "andrei@hobukob.ru" },
]
keywords = [
    "sequential analysis", "SPRT", "Kiefer-Weiss", "optional stopping", "anytime-valid inference",
    "group sequential design", "alpha spending", "change-point detection", "CUSUM", "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/andre-a-no/sequential-analysis"
Source = "https://github.com/andre-a-no/sequential-analysis"
Issues = "https://github.com/andre-a-no/sequential-analysis/issues"
Changelog = "https://github.com/andre-a-no/sequential-analysis/blob/main/CHANGELOG.md"
Paper = "https://github.com/andre-a-no/sequential-analysis/blob/main/paper/main.pdf"
"Commercial license" = "https://github.com/andre-a-no/sequential-analysis/blob/main/COMMERCIAL.md"

[project.optional-dependencies]
fast = ["numpy>=1.22"]  # the backward pass of sequential_analysis.design as array operations

[tool.setuptools.dynamic]
version = { attr = "sequential_analysis.version.__version__" }  # the one place the version is written

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sequential_analysis = ["data/*.json", "py.typed"]  # precomputed tables (tools/least_favourable_table.py); typed

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Unicode in strings and comments is intentional (Russian text, math)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731", "RUF012"]

[tool.mypy]
python_version = "3.10"
files = ["src/sequential_analysis"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_missing_imports = true  # optional; the design module uses it when it is installed
