name: release

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses PyPI trusted
# publishing: no token is stored anywhere; PyPI checks that the upload comes from
# this workflow in this repository (see RELEASING.md for the one-time setup).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag names the version of the package (version.py)
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sequential_analysis/version.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: tests against the installed wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl numpy
          mkdir /tmp/outside && cp -r tests conformance tools /tmp/outside/
          cd /tmp/outside && /tmp/venv/bin/python -W error::ResourceWarning -m unittest discover -s tests -t .
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sequential-analysis/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
