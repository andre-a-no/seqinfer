name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff mypy
      - run: ruff check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # numpy is not a dependency; it is installed only so that the tests can
      # check that numpy values are rejected with a conversion hint
      - run: python -m pip install . numpy
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: examples
        run: |
          for example in examples/0[1235-6]_*.py; do python "$example"; done
          python examples/04_kiefer_weiss_oc.py 500
      - name: conformance vectors are up to date
        run: |
          python tools/make_conformance.py
          git diff --exit-code conformance

  conformance-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node conformance/check.mjs
