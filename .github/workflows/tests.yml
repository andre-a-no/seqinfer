name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff mypy vermin==1.9.0
      - run: ruff check .
      - run: mypy
      # nothing newer than the declared minimum, Python 3.8 (see CONTRIBUTING.md, "Minimum versions")
      - run: vermin --no-tips --violations -t=3.8- src tests tools examples

  r-reference:
    # rpact and R's survival package as independent references (tools/r_reference.R): the reference
    # file is regenerated here and the Python implementation compared with the fresh one
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-rpact r-cran-survival r-cran-jsonlite
      - run: Rscript tools/r_reference.R > "$RUNNER_TEMP/r_reference.json"
      - run: python -m pip install .
      - run: R_REFERENCE="$RUNNER_TEMP/r_reference.json" python -m unittest tests.test_r_reference -v
      - name: the committed reference file is the one R writes
        run: |
          python - "$RUNNER_TEMP/r_reference.json" tests/r_reference.json <<'PY'
          import json, sys
          fresh, committed = (json.load(open(p)) for p in sys.argv[1:])
          def same(a, b):
              if isinstance(a, float) or isinstance(b, float):
                  return abs(a - b) <= 1e-9 * max(1.0, abs(a), abs(b))
              if isinstance(a, list):
                  return len(a) == len(b) and all(map(same, a, b))
              if isinstance(a, dict):
                  return a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)
              return a == b
          assert same(fresh, committed), "tests/r_reference.json differs from what tools/r_reference.R writes"
          PY

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # numpy is optional: the design module uses it when present, and the tests
      # check that numpy values are rejected with a conversion hint
      # matplotlib and hypothesis are optional too: with them the plotting and property-based tests run
      # hypothesis pinned: its derandomized examples depend on its version (6.170 needs Python 3.11)
      # hmmlearn (no wheel for 3.14 yet): the HMM fitting is compared with it
      # statsmodels (0.15 for Python >= 3.10): exponential smoothing and autoregression are compared with it
      - run: python -m pip install . numpy matplotlib "hypothesis==6.170.0; python_version>='3.11'" "hypothesis==6.141.1; python_version<'3.11'" "hmmlearn==0.3.3; python_version<'3.14'" "statsmodels==0.15.0; python_version>='3.10'"
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: examples
        run: |
          for example in examples/0[1235-9]_*.py; do python "$example"; done
          python examples/04_kiefer_weiss_oc.py 500
      - name: conformance vectors are up to date
        run: |
          python tools/make_conformance.py
          git diff --exit-code conformance

  package:
    # the released artefacts, not the source tree: build, check, install the wheel
    # into a clean environment and run the test suite from outside the checkout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: tests against the installed wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl hypothesis==6.170.0
          mkdir /tmp/outside && cp -r tests conformance tools docs mkdocs.yml /tmp/outside/
          cd /tmp/outside && /tmp/venv/bin/python -c "import sequential_analysis, sys; print(sequential_analysis.__file__); assert 'site-packages' in sequential_analysis.__file__"
          cd /tmp/outside && /tmp/venv/bin/python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: the sdist runs its own tests
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/* && python -m venv /tmp/venv2 && /tmp/venv2/bin/pip install . && /tmp/venv2/bin/python -m unittest discover -s tests -t .

  oldest:
    # the declared minimum versions: Python 3.8 with numpy 1.22.0 (the floor of the [fast] extra),
    # and Python 3.9 without numpy; the wheel is installed as a user on such a system would install it
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.8"
            extra: "numpy==1.22.0 hypothesis==6.113.0"
          - python: "3.9"
            extra: "hypothesis==6.141.1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install build && python -m build --wheel
      - run: uv venv --python ${{ matrix.python }} /tmp/old && uv pip install --python /tmp/old/bin/python dist/*.whl ${{ matrix.extra }}
      - name: tests against the installed wheel
        run: |
          mkdir /tmp/outside && cp -r tests conformance tools docs mkdocs.yml /tmp/outside/
          cd /tmp/outside && /tmp/old/bin/python -W error::ResourceWarning -m unittest discover -s tests -t .
      - name: examples
        run: |
          for example in examples/0[1235-9]_*.py; do /tmp/old/bin/python "$example"; done

  conformance-js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node conformance/check.mjs

  typescript:
    # the TypeScript executor reproduces the vectors, and a run moves Python -> TypeScript -> Python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: ts
      - run: npm test
        working-directory: ts
      - run: python -m pip install .
      - run: REQUIRE_TYPESCRIPT=1 python -m unittest tests.test_typescript -v
      # the executor itself runs on Node 16, the minimum in package.json "engines"
      - uses: actions/setup-node@v6
        with:
          node-version: "16"
      - run: REQUIRE_TYPESCRIPT=1 python -m unittest tests.test_typescript -v

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs==1.6.1 mkdocs-material==9.6.20 mkdocstrings==1.0.6 mkdocstrings-python==2.0.9
      - run: mkdocs build --strict

  benchmark:
    # time per step of every procedure, both backends; reported, not asserted (see PERFORMANCE.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - name: benchmark
        run: |
          python tools/benchmark.py | tee benchmark.txt
          { echo '## Time per step'; echo; tail -n +2 benchmark.txt; } >> "$GITHUB_STEP_SUMMARY"
