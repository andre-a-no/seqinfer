name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # numpy is not a dependency; it is installed only so that the tests can
      # check that numpy values are rejected with a conversion hint
      - run: python -m pip install . numpy
      - run: python -m unittest discover -s tests -t . -v
      - name: examples
        run: |
          for example in examples/0[1235-6]_*.py; do python "$example"; done
          python examples/04_kiefer_weiss_oc.py 500
